# Activate with: SPRING_PROFILES_ACTIVE=vault
# Requires docker compose Vault (see docker-compose.yml). Dev-only token.
spring:
  cloud:
    vault:
      enabled: true
      host: ${VAULT_HOST:127.0.0.1}
      port: ${VAULT_PORT:8200}
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:root-token-for-dev-only}
      kv:
        enabled: true
        backend: secret
        default-context: chapter-08-vault
      fail-fast: true

management:
  health:
    vault:
      enabled: true
