# Dev-mode Vault for Chapter 8. DO NOT use in production.
# The root token below is the well-known learning placeholder documented in the README.
services:
  vault:
    image: hashicorp/vault:1.17
    container_name: props-learning-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token-for-dev-only
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=root-token-for-dev-only
